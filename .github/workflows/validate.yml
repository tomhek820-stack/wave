name: Validate ZORO Director Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile tools/validate_project.py
      - name: Validate scene schema JSON
        run: python -m json.tool SCENE_SCHEMA.json > /dev/null
      - name: Check required instruction files
        run: |
          test -s CLAUDE.md
          test -s DIRECTOR_SYSTEM.md
          test -s WORKFLOW.md
          test -s QUALITY_CONTROL.md
          test -s CLAUDE_WEB_PROMPT.md
          test -s .claude/skills/video-production/SKILL.md
